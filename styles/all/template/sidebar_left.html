{% for block in loops.vinny_sidebar_left_blocks %}
	<div class="vinny-sidebar-block">
		<div class="vinny-sidebar-block-header">
			{{ block.TITLE }}
		</div>
		<div class="vinny-sidebar-block-content">
			{% if block.TEMPLATE_FILE %}
				{% INCLUDE block.TEMPLATE_FILE %}
			{% else %}
				{{ block.CONTENT|raw }}
			{% endif %}
		</div>
	</div>
{% endfor %}
