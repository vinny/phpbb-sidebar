<ul class="vinny-sidebar-list">
	{% for post in loops.sidebar_recent_posts %}
	<li class="vinny-sidebar-list-item">
		<a href="{{ post.U_POST }}" class="vinny-sidebar-list-link">{{ post.POST_SUBJECT }}</a>
		<span class="vinny-sidebar-list-meta">
			{{ lang('SIDEBAR_BY') }} {{ post.USERNAME_FULL|raw }}<br />
			{{ post.TIME }}
		</span>
	</li>
	{% endfor %}
</ul>
