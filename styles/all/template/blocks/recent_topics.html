<ul class="vinny-sidebar-list">
	{% for topic in loops.sidebar_recent_topics %}
	<li class="vinny-sidebar-list-item">
		<a href="{{ topic.U_TOPIC }}" class="vinny-sidebar-list-link">{{ topic.TOPIC_TITLE }}</a>
		<span class="vinny-sidebar-list-meta">
			{{ lang('SIDEBAR_BY') }} {{ topic.USERNAME_FULL|raw }}<br />
			{{ topic.TIME }}
		</span>
	</li>
	{% endfor %}
</ul>
